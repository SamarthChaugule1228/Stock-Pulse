server:
  port: 8080

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: stockpulse
  datasource:
    url: jdbc:h2:file:./data/stockpulse;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

commerce:
  strategy: ${COMMERCE_STRATEGY:AI}
  demand-spike-multiplier: ${DEMAND_SPIKE_MULTIPLIER:3.0}

llm:
  base-url: ${LLM_BASE_URL:https://litellm-qc.zycus.net/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:qwen-cursor}
  product: ${LLM_PRODUCT:PC1}
  cookie: ${LLM_COOKIE:}
